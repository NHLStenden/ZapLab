services:
  web:
    container_name: zaplab
    build: ./webserver
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - lab_data:/var/lib/lab
    environment:
      - PHP_DISPLAY_ERRORS=1
    restart: unless-stopped
  k6:
    build: ./load
    profiles: ["loadtest"]
    depends_on:
      - web
    environment:
      - BASE_URL=http://web
    volumes:
      - ./load:/scripts:ro

volumes:
  lab_data:
